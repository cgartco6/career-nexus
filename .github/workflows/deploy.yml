name: CareerNexus Enterprise Production Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Build Context Framework
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate Frontend Node Dependencies Compilation
        run: |
          npm ci
          npm run build --no-lint

      - name: Setup Python Production Environment Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Verify Backend Python Dependencies Assembly
        run: |
          pip install -r requirements.txt

      - name: Push Build Artifacts to Vercel Infrastructure
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
